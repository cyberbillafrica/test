<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Test Upload + DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">

<div class="container">
    <h2>Full Test: Drive + Supabase</h2>
    
    <form id="testForm">
        <div class="mb-3">
            <label>Skill Evidence</label>
            <input type="file" id="skill_evidence" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Passport</label>
            <input type="file" id="passport" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Full Name (for test)</label>
            <input type="text" id="full_name" class="form-control" value="Test User" required>
        </div>
        <div class="mb-3">
            <label>NIN (for test)</label>
            <input type="text" id="nin" class="form-control" value="12345678901" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Run Full Test</button>
    </form>
</div>

<script type="module" src="assets/supabase.js"></script>

<script>

document.getElementById('applicationForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;

    try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = "Uploading...";

        const skillFile = document.getElementById('skill_evidence').files[0];
        const passportFile = document.getElementById('passport').files[0];

        // Upload Skill Evidence
        const skillForm = new FormData();
        skillForm.append('fileData', Utilities.base64Encode(await skillFile.arrayBuffer()));
        skillForm.append('filename', `skill_${Date.now()}_${skillFile.name}`);
        skillForm.append('mimeType', skillFile.type);

        const skillRes = await fetch('https://script.google.com/macros/s/AKfycbwMJKXcR0Rs3nwZ5P_gqveVeb-Zm_q_WKJTu786awN9w0LP9do39OXqV_IvvtJZx38/exec', { method: 'POST', body: skillForm });
        const skillData = await skillRes.json();

        // Upload Passport
        const passportForm = new FormData();
        passportForm.append('fileData', Utilities.base64Encode(await passportFile.arrayBuffer()));
        passportForm.append('filename', `passport_${Date.now()}_${passportFile.name}`);
        passportForm.append('mimeType', passportFile.type);

        const passportRes = await fetch('https://script.google.com/macros/s/AKfycbwMJKXcR0Rs3nwZ5P_gqveVeb-Zm_q_WKJTu786awN9w0LP9do39OXqV_IvvtJZx38/exec', { method: 'POST', body: passportForm });
        const passportData = await passportRes.json();

        // Insert to Supabase
        const formData = {
            full_name: document.getElementById('full_name').value.trim(),
            age: parseInt(document.getElementById('age').value),
            gender: document.getElementById('gender').value,
            lga: document.getElementById('lga').value,
            ward: document.getElementById('ward').value,
            village: document.getElementById('village').value.trim(),
            community: document.getElementById('community').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            nin: document.getElementById('nin').value.trim(),
            account_name: document.getElementById('account_name').value.trim(),
            account_number: document.getElementById('account_number').value.trim(),
            bank_name: document.getElementById('bank_name').value.trim(),
            skill_type: document.getElementById('skill_type').value.trim(),
            empowerment_choice: document.getElementById('empowerment_choice').value,
            skill_evidence_url: skillData.publicUrl,
            passport_url: passportData.publicUrl,
            status: "pending",
            shortlisted: false,
            selected: false,
            rejected: false
        };

        const { error } = await supabase.from('applications').insert([formData]);

        if (error) throw error;

        alert("✅ Application submitted successfully!");
        window.location.href = "success.html";

    } catch (error) {
        console.error(error);
        alert("❌ " + error.message);
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
    }
});

</script>



</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Test Upload + DB</title>
    <link href="assets/logo.png" rel="icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">

<div class="container">
    <h2>Full Test: Drive + Supabase</h2>
    
    <form id="testForm">
        <div class="mb-3">
            <label>Skill Evidence</label>
            <input type="file" id="skill_evidence" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Passport</label>
            <input type="file" id="passport" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Full Name (for test)</label>
            <input type="text" id="full_name" class="form-control" value="Test User" required>
        </div>
        <div class="mb-3">
            <label>NIN (for test)</label>
            <input type="text" id="nin" class="form-control" value="12345678901" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Run Full Test</button>
    </form>
</div>

<script type="module" src="assets/supabase.js"></script>

<script type="module">
// Helper function to read file as Base64 in the browser
const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => {
        // Extract only the base64 string part, leaving out the Data URL prefix
        const base64String = reader.result.split(',')[1];
        resolve(base64String);
    };
    reader.onerror = error => reject(error);
});

document.getElementById('testForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;

    try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = "Uploading...";

        const skillFile = document.getElementById('skill_evidence').files[0];
        const passportFile = document.getElementById('passport').files[0];

        const googleScriptUrl = 'https://script.google.com/macros/s/AKfycbwMJKXcR0Rs3nwZ5P_gqveVeb-Zm_q_WKJTu786awN9w0LP9do39OXqV_IvvtJZx38/exec';

        // Upload Skill Evidence
        const skillBase64 = await toBase64(skillFile);
        const skillForm = new FormData();
        skillForm.append('fileData', skillBase64);
        skillForm.append('filename', `skill_${Date.now()}_${skillFile.name}`);
        skillForm.append('mimeType', skillFile.type);

        const skillRes = await fetch(googleScriptUrl, { method: 'POST', body: skillForm });
        const skillData = await skillRes.json();

        // Upload Passport
        const passportBase64 = await toBase64(passportFile);
        const passportForm = new FormData();
        passportForm.append('fileData', passportBase64);
        passportForm.append('filename', `passport_${Date.now()}_${passportFile.name}`);
        passportForm.append('mimeType', passportFile.type);

        const passportRes = await fetch(googleScriptUrl, { method: 'POST', body: passportForm });
        const passportData = await passportRes.json();

        // Construct Form Data (Using defaults/placeholders for elements not present in HTML)
        const formData = {
            full_name: document.getElementById('full_name').value.trim(),
            age: 25, // Fallback placeholder since field is missing in current test HTML
            gender: "Not Specified", 
            lga: "Test LGA",
            ward: "Test Ward",
            village: "Test Village",
            community: "Test Community",
            phone: "08000000000",
            nin: document.getElementById('nin').value.trim(),
            account_name: "Test Account",
            account_number: "0000000000",
            bank_name: "Test Bank",
            skill_type: "Testing",
            empowerment_choice: "None",
            skill_evidence_url: skillData.publicUrl || "", 
            passport_url: passportData.publicUrl || "",
            status: "pending",
            shortlisted: false,
            selected: false,
            rejected: false
        };

        // Note: Make sure "supabase" client is initialized and exposed globally inside assets/supabase.js
        const { error } = await window.supabase.from('applications').insert([formData]);

        if (error) throw error;

        alert("✅ Application submitted successfully!");
        window.location.href = "success.html";

    } catch (error) {
        console.error(error);
        alert("❌ " + error.message);
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
    }
});
</script>

</body>
</html>
